<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平服判別クイズ</title>
<meta name="description" content="「平服でお越しください」ってどこまでOK？ 服装を見て○か✕かを判定する平服マナークイズ">
<meta property="og:title" content="平服判別クイズ">
<meta property="og:description" content="「平服でお越しください」ってどこまでOK？ 服装を見て○か✕かを判定する平服マナークイズ">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3b4a6b">
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --text: #1f2328; --sub: #6b7280; --line: #e3e1da;
    --accent: #3b4a6b; --accent-weak: #e6e9f1;
    --ok: #2f7d5b; --ok-weak: #e3f1ea; --ng: #c0392b; --ng-weak: #f8e4e1;
    --tag-joy: #b5651d; --tag-sad: #4b5563; --tag-biz: #3b4a6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1f2226; --text: #e8eaed; --sub: #9aa0a6; --line: #33373c;
      --accent: #8fa3d1; --accent-weak: #262d3d;
      --ok: #5cc496; --ok-weak: #1f3429; --ng: #ef6b5c; --ng-weak: #3a2321;
      --tag-joy: #e0a060; --tag-sad: #aab2bd; --tag-biz: #8fa3d1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 16px 0 4px; text-align: center; }
  .lead { text-align: center; color: var(--sub); margin: 0 0 20px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; margin: 0 0 8px; }
  .card p { margin: 0 0 8px; }
  .card ul { margin: 0; padding-left: 1.2em; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 10px; }
  .primary { width: 100%; padding: 14px; background: var(--accent); color: #fff; font-weight: 600; font-size: 1.05rem; }
  @media (prefers-color-scheme: dark) { .primary { color: #15171a; } }
  .hidden { display: none !important; }
  .best { text-align: center; color: var(--sub); font-size: .9rem; margin-top: 12px; }

  .progress { display: flex; justify-content: space-between; color: var(--sub); font-size: .9rem; margin-bottom: 8px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
  .tag { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; margin-bottom: 10px; }
  .tag.joy { color: var(--tag-joy); } .tag.sad { color: var(--tag-sad); } .tag.biz { color: var(--tag-biz); }
  .scene { color: var(--sub); font-size: .9rem; margin-bottom: 4px; }
  .outfit { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  .ask { color: var(--sub); font-size: .9rem; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .answers button { padding: 18px 8px; font-size: 1.6rem; font-weight: 700; background: var(--card); border: 2px solid var(--line); color: var(--text); }
  .answers button span { display: block; font-size: .8rem; font-weight: 400; color: var(--sub); }
  .answers button.ok:hover:not(:disabled) { border-color: var(--ok); }
  .answers button.ng:hover:not(:disabled) { border-color: var(--ng); }
  .answers button:disabled { cursor: default; opacity: .5; }
  .answers button.picked { opacity: 1; }
  .feedback { border-radius: 12px; padding: 16px; margin-top: 16px; }
  .feedback.right { background: var(--ok-weak); }
  .feedback.wrong { background: var(--ng-weak); }
  .feedback .verdict { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
  .feedback.right .verdict { color: var(--ok); } .feedback.wrong .verdict { color: var(--ng); }
  .feedback p { margin: 0; font-size: .95rem; }
  .next { margin-top: 16px; }

  .score { text-align: center; }
  .score .num { font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .score .rank { font-size: 1.2rem; font-weight: 700; margin: 8px 0 4px; }
  .score .comment { color: var(--sub); font-size: .95rem; }
  .review { list-style: none; padding: 0 !important; margin: 0; }
  .review li { padding: 12px 0; border-top: 1px solid var(--line); font-size: .9rem; }
  .review li:first-child { border-top: none; padding-top: 0; }
  .review .mark { font-weight: 700; margin-right: 6px; }
  .review .mark.r { color: var(--ok); } .review .mark.w { color: var(--ng); }
  .review .exp { color: var(--sub); font-size: .85rem; margin-top: 2px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .secondary { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 600; }
  .note { color: var(--sub); font-size: .8rem; text-align: center; margin-top: 24px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>平服判別クイズ</h1>
  <p class="lead">「平服でお越しください」<br>その服装、○か✕か？</p>

  <!-- スタート画面 -->
  <section id="start">
    <div class="card">
      <h2>そもそも「平服」とは？</h2>
      <p>招待状の「平服で」は<strong>普段着のことではありません</strong>。正式な礼服でなくてよい、という意味で、<strong>略礼装</strong>を指すのが一般的です。</p>
      <ul>
        <li>お祝いの席 → きちんと感のあるスーツやワンピース</li>
        <li>法事・お別れの会 → 地味な色の「略喪服」</li>
      </ul>
    </div>
    <div class="card">
      <p style="margin-bottom:16px">場面と服装を見て、平服として<strong>ふさわしければ○、ふさわしくなければ✕</strong>を選んでください。全<span id="qCount"></span>問です。</p>
      <button class="primary" id="startBtn">スタート</button>
      <div class="best" id="best"></div>
    </div>
  </section>

  <!-- 問題画面 -->
  <section id="quiz" class="hidden">
    <div class="progress"><span id="qNum"></span><span id="qScore"></span></div>
    <div class="bar"><div id="qBar"></div></div>
    <div class="card">
      <span class="tag" id="qTag"></span>
      <div class="scene" id="qScene"></div>
      <p class="outfit" id="qOutfit"></p>
      <div class="ask">平服としてふさわしい？</div>
      <div class="answers">
        <button class="ok" data-ans="1">○<span>ふさわしい</span></button>
        <button class="ng" data-ans="0">✕<span>ふさわしくない</span></button>
      </div>
      <div id="feedback" class="feedback hidden">
        <div class="verdict" id="fbVerdict"></div>
        <p id="fbText"></p>
      </div>
      <button class="primary next hidden" id="nextBtn">次へ</button>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="result" class="hidden">
    <div class="card score">
      <div class="num" id="rScore"></div>
      <div class="rank" id="rRank"></div>
      <div class="comment" id="rComment"></div>
    </div>
    <div class="row2" style="margin-bottom:16px">
      <button class="primary" id="retryBtn">もう一度</button>
      <button class="secondary" id="shareBtn">結果をシェア</button>
    </div>
    <div class="card">
      <h2>答え合わせ</h2>
      <ul class="review" id="review"></ul>
    </div>
  </section>

  <p class="note">※ 一般的なマナーをもとにしています。地域や家・会場の方針によって異なる場合があります。</p>
</main>
<div class="toast" id="toast"></div>

<script>
// type: joy=慶事, sad=弔事, biz=ビジネス ／ ok: 平服として適切か
const QUESTIONS = [
  { type: 'joy', scene: '結婚披露宴・男性', outfit: 'ネイビーのダークスーツに白シャツ、明るい色のネクタイ', ok: true,
    exp: 'ダークスーツは男性の略礼装の定番。ネクタイやポケットチーフでお祝いらしい華やかさを出すとさらに◎。' },
  { type: 'joy', scene: '結婚披露宴・男性', outfit: 'きれいめのジャケットに濃い色のジーンズ', ok: false,
    exp: '平服は「普段着」ではなく略礼装のこと。ジーンズはどんなにきれいめでもカジュアル扱いです。' },
  { type: 'joy', scene: '結婚披露宴・男性', outfit: 'スーツにノーネクタイ、足元は白いスニーカー', ok: false,
    exp: '結婚式の平服ではネクタイと革靴が基本。スニーカーはカジュアルすぎます。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: '上品な白いワンピース', ok: false,
    exp: '白は花嫁の色なので、ゲストは避けるのがマナー。白っぽく見えるベージュや淡いグレーも注意。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: '膝丈のネイビーのワンピースにストッキングとパンプス', ok: true,
    exp: '女性の平服の王道。アクセサリーやバッグで華やかさを足せば完璧です。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: 'ヒョウ柄のワンピース', ok: false,
    exp: 'アニマル柄や毛皮は「殺生」を連想させるため、お祝いの席では避けるのがマナーです。' },
  { type: 'joy', scene: '昼の結婚披露宴・女性', outfit: '肩が大きく出たドレスで、羽織りものなし', ok: false,
    exp: '昼の式は露出を控えるのが基本。肩が出るドレスならボレロやショールを羽織りましょう。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: 'とろみ素材のきれいめパンツスーツにアクセサリー', ok: true,
    exp: 'パンツスタイルも略礼装としてOK。ビジネスっぽくならないよう、素材感や小物で華やかさを。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: 'ワンピースにかかとのないミュール', ok: false,
    exp: 'ミュールやサンダルはカジュアルな履物とされます。かかとのあるパンプスが無難です。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: '黒のワンピースに、バッグも靴もアクセサリーもすべて黒', ok: false,
    exp: '全身黒は喪服を連想させます。黒いドレス自体はOKなので、明るい色の小物やパールで華やかさを足しましょう。' },
  { type: 'joy', scene: '結婚披露宴・高校生', outfit: '学校の制服', ok: true,
    exp: '学生にとって制服は正装。慶事でも弔事でも安心して着ていけます。' },
  { type: 'sad', scene: '三回忌の法要・男性', outfit: 'ダークグレーのスーツに黒無地のネクタイ', ok: true,
    exp: '法事の「平服」は略喪服のこと。黒・紺・グレーなど地味な色のスーツが適切です。' },
  { type: 'sad', scene: '三回忌の法要・男性', outfit: '清潔なポロシャツとチノパン', ok: false,
    exp: '法事の平服も普段着ではありません。落ち着いた色のスーツを選びましょう。' },
  { type: 'sad', scene: '三回忌の法要・女性', outfit: '黒のワンピースに一連のパールネックレス', ok: true,
    exp: '地味な色のワンピースは略喪服として適切。パールは弔事でもつけてよいアクセサリーです。' },
  { type: 'sad', scene: '三回忌の法要・女性', outfit: '紺のワンピースに二連のパールネックレス', ok: false,
    exp: '二連のネックレスは「不幸が重なる」を連想させるため弔事ではNG。パールは一連にしましょう。' },
  { type: 'sad', scene: '法要・女性', outfit: 'グレーのスーツに光沢の強いゴールドのアクセサリー', ok: false,
    exp: '弔事では光るもの・目立つものは控えます。アクセサリーはパール程度にとどめましょう。' },
  { type: 'sad', scene: 'お別れの会・女性', outfit: '明るい花柄のワンピース', ok: false,
    exp: 'お別れの会の平服は略喪服。黒・紺・グレーなどの地味な色の無地を選びます。' },
  { type: 'biz', scene: '取引先の創立記念パーティー・男性', outfit: '普段から着ている濃紺のビジネススーツ', ok: true,
    exp: 'ビジネスのパーティーでの平服は、きちんとしたビジネススーツで問題ありません。' },
  { type: 'biz', scene: '取引先の創立記念パーティー・女性', outfit: 'ジャケットにひざ丈スカートのセットアップ', ok: true,
    exp: 'きちんと感のあるセットアップは略礼装として◎。コサージュやアクセサリーで少し華やかに。' },
  { type: 'biz', scene: '取引先の創立記念パーティー・男性', outfit: 'パーカーにスラックス', ok: false,
    exp: 'パーカーは明らかな普段着。平服＝略礼装なのでジャケットとネクタイを着用しましょう。' },
];
const TYPE_LABEL = { joy: 'お祝いの席', sad: '弔事', biz: 'ビジネス' };
const ROUND = 10;
const BEST_KEY = 'heihuku-best';

const $ = id => document.getElementById(id);
let order = [], idx = 0, score = 0, log = [];

function getBest() { try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem(BEST_KEY, v); } catch (e) {} }
function showBest() { const b = getBest(); $('best').textContent = b ? `これまでの最高：${b} / ${ROUND}問` : ''; }

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function show(id) {
  ['start', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo(0, 0);
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function start() {
  order = shuffle(QUESTIONS).slice(0, ROUND);
  idx = 0; score = 0; log = [];
  show('quiz'); renderQ();
}

function renderQ() {
  const q = order[idx];
  $('qNum').textContent = `第${idx + 1}問 / ${order.length}`;
  $('qScore').textContent = `正解 ${score}`;
  $('qBar').style.width = `${idx / order.length * 100}%`;
  $('qTag').className = `tag ${q.type}`;
  $('qTag').textContent = TYPE_LABEL[q.type];
  $('qScene').textContent = `「平服で」と言われた ${q.scene}`;
  $('qOutfit').textContent = q.outfit;
  document.querySelectorAll('.answers button').forEach(b => { b.disabled = false; b.classList.remove('picked'); });
  $('feedback').classList.add('hidden');
  $('nextBtn').classList.add('hidden');
}

function answer(btn) {
  const q = order[idx];
  const pick = btn.dataset.ans === '1';
  const right = pick === q.ok;
  if (right) score++;
  log.push({ q, right });
  document.querySelectorAll('.answers button').forEach(b => b.disabled = true);
  btn.classList.add('picked');
  $('feedback').className = `feedback ${right ? 'right' : 'wrong'}`;
  $('fbVerdict').textContent = `${right ? '正解！' : '不正解…'}　答えは「${q.ok ? '○' : '✕'}」`;
  $('fbText').textContent = q.exp;
  $('qScore').textContent = `正解 ${score}`;
  $('nextBtn').textContent = idx + 1 < order.length ? '次へ' : '結果を見る';
  $('nextBtn').classList.remove('hidden');
  $('nextBtn').focus({ preventScroll: true });
  $('nextBtn').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function rank(s, n) {
  const r = s / n;
  if (r === 1) return ['平服マスター', 'どんな招待状が来ても安心。周りの人にも教えてあげてください。'];
  if (r >= .8) return ['マナー上級者', 'ほぼ完璧！ 間違えた問題だけ答え合わせで確認しておきましょう。'];
  if (r >= .5) return ['まずまず', '基本は押さえています。「平服＝略礼装」を意識すると迷いが減ります。'];
  return ['要注意', '「平服＝普段着」ではありません。答え合わせでポイントを確認しましょう。'];
}

function finish() {
  const [title, comment] = rank(score, order.length);
  $('rScore').textContent = `${score} / ${order.length}`;
  $('rRank').textContent = title;
  $('rComment').textContent = comment;
  if (score > getBest()) setBest(score);
  $('review').innerHTML = '';
  log.forEach(({ q, right }) => {
    const li = document.createElement('li');
    li.innerHTML = `<div><span class="mark ${right ? 'r' : 'w'}"></span><span class="t"></span></div><div class="exp"></div>`;
    li.querySelector('.mark').textContent = right ? '○' : '✕';
    li.querySelector('.t').textContent = `${q.scene}：${q.outfit} → 答え「${q.ok ? '○' : '✕'}」`;
    li.querySelector('.exp').textContent = q.exp;
    $('review').appendChild(li);
  });
  show('result');
}

async function share() {
  const text = `平服判別クイズで ${score}/${order.length}問正解！【${rank(score, order.length)[0]}】`;
  const url = location.href.split('#')[0].split('?')[0];
  if (navigator.share) {
    try { await navigator.share({ title: '平服判別クイズ', text, url }); } catch (e) {}
    return;
  }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('コピーしました'); }
  catch (e) { prompt('コピーしてください', `${text}\n${url}`); }
}

document.querySelectorAll('.answers button').forEach(b => b.addEventListener('click', () => answer(b)));
$('nextBtn').addEventListener('click', () => { idx++; idx < order.length ? renderQ() : finish(); });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('shareBtn').addEventListener('click', share);
$('qCount').textContent = ROUND;
showBest();
</script>
</body>
</html>
