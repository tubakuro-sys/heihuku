<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平服判別クイズ</title>
<meta name="description" content="「平服でお越しください」ってどこまでOK？ 服装を見て○か✕かを判定する平服マナークイズ">
<meta property="og:title" content="平服判別クイズ">
<meta property="og:description" content="「平服でお越しください」ってどこまでOK？ 服装を見て○か✕かを判定する平服マナークイズ">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3b4a6b">
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --text: #1f2328; --sub: #6b7280; --line: #e3e1da;
    --accent: #3b4a6b; --accent-weak: #e6e9f1;
    --ok: #2f7d5b; --ok-weak: #e3f1ea; --ng: #c0392b; --ng-weak: #f8e4e1;
    --tag-joy: #b5651d; --tag-sad: #4b5563; --tag-biz: #3b4a6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1f2226; --text: #e8eaed; --sub: #9aa0a6; --line: #33373c;
      --accent: #8fa3d1; --accent-weak: #262d3d;
      --ok: #5cc496; --ok-weak: #1f3429; --ng: #ef6b5c; --ng-weak: #3a2321;
      --tag-joy: #e0a060; --tag-sad: #aab2bd; --tag-biz: #8fa3d1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 16px 0 4px; text-align: center; }
  .lead { text-align: center; color: var(--sub); margin: 0 0 20px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; margin: 0 0 8px; }
  .card p { margin: 0 0 8px; }
  .card ul { margin: 0; padding-left: 1.2em; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 10px; }
  .primary { width: 100%; padding: 14px; background: var(--accent); color: #fff; font-weight: 600; font-size: 1.05rem; }
  @media (prefers-color-scheme: dark) { .primary { color: #15171a; } }
  .hidden { display: none !important; }
  .best { text-align: center; color: var(--sub); font-size: .9rem; margin-top: 12px; }

  .progress { display: flex; justify-content: space-between; color: var(--sub); font-size: .9rem; margin-bottom: 8px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
  .tag { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; margin-bottom: 10px; }
  .tag.joy { color: var(--tag-joy); } .tag.sad { color: var(--tag-sad); } .tag.biz { color: var(--tag-biz); }
  .scene { color: var(--sub); font-size: .9rem; margin-bottom: 4px; }
  .outfit { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  .ask { color: var(--sub); font-size: .9rem; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .answers button { padding: 18px 8px; font-size: 1.6rem; font-weight: 700; background: var(--card); border: 2px solid var(--line); color: var(--text); }
  .answers button span { display: block; font-size: .8rem; font-weight: 400; color: var(--sub); }
  .answers button.ok:hover:not(:disabled) { border-color: var(--ok); }
  .answers button.ng:hover:not(:disabled) { border-color: var(--ng); }
  .answers button:disabled { cursor: default; opacity: .5; }
  .answers button.picked { opacity: 1; }
  .feedback { border-radius: 12px; padding: 16px; margin-top: 16px; }
  .feedback.right { background: var(--ok-weak); }
  .feedback.wrong { background: var(--ng-weak); }
  .feedback .verdict { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
  .feedback.right .verdict { color: var(--ok); } .feedback.wrong .verdict { color: var(--ng); }
  .feedback p { margin: 0; font-size: .95rem; }
  .next { margin-top: 16px; }

  .score { text-align: center; }
  .score .num { font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .score .rank { font-size: 1.2rem; font-weight: 700; margin: 8px 0 4px; }
  .score .comment { color: var(--sub); font-size: .95rem; }
  .review { list-style: none; padding: 0 !important; margin: 0; }
  .review li { padding: 12px 0; border-top: 1px solid var(--line); font-size: .9rem; }
  .review li:first-child { border-top: none; padding-top: 0; }
  .review .mark { font-weight: 700; margin-right: 6px; }
  .review .mark.r { color: var(--ok); } .review .mark.w { color: var(--ng); }
  .review .exp { color: var(--sub); font-size: .85rem; margin-top: 2px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .secondary { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 600; }
  .note { color: var(--sub); font-size: .8rem; text-align: center; margin-top: 24px; }
  .hero { display: flex; justify-content: center; gap: 8px; margin: 0 0 12px; }
  .hero svg { height: 150px; width: auto; }
  .figwrap { position: relative; display: flex; justify-content: center; background: var(--accent-weak); border-radius: 12px; padding: 12px 0 6px; margin-bottom: 12px; }
  .figwrap svg { height: 170px; width: auto; }
  .stamp { position: absolute; top: 8px; right: 14px; font-size: 3.2rem; font-weight: 700; line-height: 1; opacity: 0; transform: scale(1.6) rotate(-12deg); transition: all .25s; }
  .stamp.show { opacity: .9; transform: scale(1) rotate(-12deg); }
  .stamp.o { color: var(--ok); } .stamp.x { color: var(--ng); }
  .review li { display: flex; gap: 10px; align-items: flex-start; }
  .review .thumb { flex: 0 0 auto; width: 40px; background: var(--accent-weak); border-radius: 8px; padding: 2px 0; }
  .review .thumb svg { display: block; width: 100%; height: auto; }
  .review .body { flex: 1; min-width: 0; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>平服判別クイズ</h1>
  <p class="lead">「平服でお越しください」<br>その服装、○か✕か？</p>
  <div class="hero" id="hero"></div>

  <!-- スタート画面 -->
  <section id="start">
    <div class="card">
      <h2>そもそも「平服」とは？</h2>
      <p>招待状の「平服で」は<strong>普段着のことではありません</strong>。正式な礼服でなくてよい、という意味で、<strong>略礼装</strong>を指すのが一般的です。</p>
      <ul>
        <li>お祝いの席 → きちんと感のあるスーツやワンピース</li>
        <li>法事・お別れの会 → 地味な色の「略喪服」</li>
      </ul>
    </div>
    <div class="card">
      <p style="margin-bottom:16px">場面と服装を見て、平服として<strong>ふさわしければ○、ふさわしくなければ✕</strong>を選んでください。全<span id="qCount"></span>問です。</p>
      <button class="primary" id="startBtn">スタート</button>
      <div class="best" id="best"></div>
    </div>
  </section>

  <!-- 問題画面 -->
  <section id="quiz" class="hidden">
    <div class="progress"><span id="qNum"></span><span id="qScore"></span></div>
    <div class="bar"><div id="qBar"></div></div>
    <div class="card">
      <div class="figwrap"><div id="qFig"></div><div class="stamp" id="qStamp"></div></div>
      <span class="tag" id="qTag"></span>
      <div class="scene" id="qScene"></div>
      <p class="outfit" id="qOutfit"></p>
      <div class="ask">平服としてふさわしい？</div>
      <div class="answers">
        <button class="ok" data-ans="1">○<span>ふさわしい</span></button>
        <button class="ng" data-ans="0">✕<span>ふさわしくない</span></button>
      </div>
      <div id="feedback" class="feedback hidden">
        <div class="verdict" id="fbVerdict"></div>
        <p id="fbText"></p>
      </div>
      <button class="primary next hidden" id="nextBtn">次へ</button>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="result" class="hidden">
    <div class="card score">
      <div class="num" id="rScore"></div>
      <div class="rank" id="rRank"></div>
      <div class="comment" id="rComment"></div>
    </div>
    <div class="row2" style="margin-bottom:16px">
      <button class="primary" id="retryBtn">もう一度</button>
      <button class="secondary" id="shareBtn">結果をシェア</button>
    </div>
    <div class="card">
      <h2>答え合わせ</h2>
      <ul class="review" id="review"></ul>
    </div>
  </section>

  <p class="note">※ 一般的なマナーをもとにしています。地域や家・会場の方針によって異なる場合があります。</p>
</main>
<div class="toast" id="toast"></div>

<script>
// type: joy=慶事, sad=弔事, biz=ビジネス ／ ok: 平服として適切か
const QUESTIONS = [
  { type: 'joy', scene: '結婚披露宴・男性', outfit: 'ネイビーのダークスーツに白シャツ、明るい色のネクタイ', ok: true,
    exp: 'ダークスーツは男性の略礼装の定番。ネクタイやポケットチーフでお祝いらしい華やかさを出すとさらに◎。' },
  { type: 'joy', scene: '結婚披露宴・男性', outfit: 'きれいめのジャケットに濃い色のジーンズ', ok: false,
    exp: '平服は「普段着」ではなく略礼装のこと。ジーンズはどんなにきれいめでもカジュアル扱いです。' },
  { type: 'joy', scene: '結婚披露宴・男性', outfit: 'スーツにノーネクタイ、足元は白いスニーカー', ok: false,
    exp: '結婚式の平服ではネクタイと革靴が基本。スニーカーはカジュアルすぎます。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: '上品な白いワンピース', ok: false,
    exp: '白は花嫁の色なので、ゲストは避けるのがマナー。白っぽく見えるベージュや淡いグレーも注意。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: '膝丈のネイビーのワンピースにストッキングとパンプス', ok: true,
    exp: '女性の平服の王道。アクセサリーやバッグで華やかさを足せば完璧です。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: 'ヒョウ柄のワンピース', ok: false,
    exp: 'アニマル柄や毛皮は「殺生」を連想させるため、お祝いの席では避けるのがマナーです。' },
  { type: 'joy', scene: '昼の結婚披露宴・女性', outfit: '肩が大きく出たドレスで、羽織りものなし', ok: false,
    exp: '昼の式は露出を控えるのが基本。肩が出るドレスならボレロやショールを羽織りましょう。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: 'とろみ素材のきれいめパンツスーツにアクセサリー', ok: true,
    exp: 'パンツスタイルも略礼装としてOK。ビジネスっぽくならないよう、素材感や小物で華やかさを。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: 'ワンピースにかかとのないミュール', ok: false,
    exp: 'ミュールやサンダルはカジュアルな履物とされます。かかとのあるパンプスが無難です。' },
  { type: 'joy', scene: '結婚披露宴・女性', outfit: '黒のワンピースに、バッグも靴もアクセサリーもすべて黒', ok: false,
    exp: '全身黒は喪服を連想させます。黒いドレス自体はOKなので、明るい色の小物やパールで華やかさを足しましょう。' },
  { type: 'joy', scene: '結婚披露宴・高校生', outfit: '学校の制服', ok: true,
    exp: '学生にとって制服は正装。慶事でも弔事でも安心して着ていけます。' },
  { type: 'sad', scene: '三回忌の法要・男性', outfit: 'ダークグレーのスーツに黒無地のネクタイ', ok: true,
    exp: '法事の「平服」は略喪服のこと。黒・紺・グレーなど地味な色のスーツが適切です。' },
  { type: 'sad', scene: '三回忌の法要・男性', outfit: '清潔なポロシャツとチノパン', ok: false,
    exp: '法事の平服も普段着ではありません。落ち着いた色のスーツを選びましょう。' },
  { type: 'sad', scene: '三回忌の法要・女性', outfit: '黒のワンピースに一連のパールネックレス', ok: true,
    exp: '地味な色のワンピースは略喪服として適切。パールは弔事でもつけてよいアクセサリーです。' },
  { type: 'sad', scene: '三回忌の法要・女性', outfit: '紺のワンピースに二連のパールネックレス', ok: false,
    exp: '二連のネックレスは「不幸が重なる」を連想させるため弔事ではNG。パールは一連にしましょう。' },
  { type: 'sad', scene: '法要・女性', outfit: 'グレーのスーツに光沢の強いゴールドのアクセサリー', ok: false,
    exp: '弔事では光るもの・目立つものは控えます。アクセサリーはパール程度にとどめましょう。' },
  { type: 'sad', scene: 'お別れの会・女性', outfit: '明るい花柄のワンピース', ok: false,
    exp: 'お別れの会の平服は略喪服。黒・紺・グレーなどの地味な色の無地を選びます。' },
  { type: 'biz', scene: '取引先の創立記念パーティー・男性', outfit: '普段から着ている濃紺のビジネススーツ', ok: true,
    exp: 'ビジネスのパーティーでの平服は、きちんとしたビジネススーツで問題ありません。' },
  { type: 'biz', scene: '取引先の創立記念パーティー・女性', outfit: 'ジャケットにひざ丈スカートのセットアップ', ok: true,
    exp: 'きちんと感のあるセットアップは略礼装として◎。コサージュやアクセサリーで少し華やかに。' },
  { type: 'biz', scene: '取引先の創立記念パーティー・男性', outfit: 'パーカーにスラックス', ok: false,
    exp: 'パーカーは明らかな普段着。平服＝略礼装なのでジャケットとネクタイを着用しましょう。' },
];

// ---- イラスト（QUESTIONS と同じ順番） ----
// g: m=男性 / f=女性
const NAVY = '#26345a', CHAR = '#4a4d52', GRAY = '#7a7e85', BLK = '#1e1e1e';
const FIGS = [
  { g: 'm', top: 'suit', c: NAVY, tie: '#d9963a' },
  { g: 'm', top: 'jacket', c: GRAY, inner: '#f2f2f2', legs: '#3d5a8a' },
  { g: 'm', top: 'suit', c: CHAR, shoes: 'sneaker' },
  { g: 'f', dress: '#fbfaf6', necklace: 1 },
  { g: 'f', dress: NAVY, necklace: 1, bag: '#c9a66b' },
  { g: 'f', dress: 'leopard' },
  { g: 'f', dress: '#b84a62', off: true, bag: '#e8d9b5' },
  { g: 'f', top: 'jacket', c: '#c9b19a', inner: '#fbfaf6', bottom: 'pants', necklace: 1 },
  { g: 'f', dress: '#5c7a6b', shoes: 'mule' },
  { g: 'f', dress: BLK, bag: BLK, shoeC: BLK },
  { g: 'm', top: 'suit', c: '#1f2a4a', tie: '#a33a3a', legs: '#5a5e66', emblem: true, young: true },
  { g: 'm', top: 'suit', c: CHAR, tie: BLK },
  { g: 'm', top: 'polo', c: '#3f7fbf', legs: '#c8b48a' },
  { g: 'f', dress: BLK, necklace: 1, bag: BLK, shoeC: BLK },
  { g: 'f', dress: NAVY, necklace: 2, bag: BLK },
  { g: 'f', top: 'jacket', c: GRAY, inner: '#2a2a2a', bottom: 'skirt', gold: true },
  { g: 'f', dress: 'floral' },
  { g: 'm', top: 'suit', c: NAVY, tie: '#7a2b3a' },
  { g: 'f', top: 'jacket', c: NAVY, inner: '#fbfaf6', bottom: 'skirt', necklace: 1, bag: '#c9a66b' },
  { g: 'm', top: 'hoodie', c: '#8a8f96', legs: '#2e2e2e' },
];
QUESTIONS.forEach((q, i) => q.fig = FIGS[i]);

const SKIN = '#f1c9a5', HAIR = '#2e2a28', EDGE = 'rgba(0,0,0,.22)';
let figSeq = 0;
function figure(s) {
  const id = 'fg' + (++figSeq), defs = {};
  const fill = c => {
    if (c === 'leopard') {
      defs.l = `<pattern id="${id}l" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d9a85b"/><circle cx="3" cy="3" r="1.8" fill="#3a2a1a"/><circle cx="8" cy="7.5" r="1.5" fill="#3a2a1a"/><circle cx="7.5" cy="2" r=".9" fill="#7a5530"/><circle cx="2" cy="8" r=".9" fill="#7a5530"/></pattern>`;
      return `url(#${id}l)`;
    }
    if (c === 'floral') {
      defs.f = `<pattern id="${id}f" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#fff1c2"/><circle cx="3" cy="3" r="2.2" fill="#ef7fa0"/><circle cx="3" cy="3" r=".8" fill="#ffd34d"/><circle cx="9" cy="9" r="2.2" fill="#f59a42"/><circle cx="9" cy="9" r=".8" fill="#fff"/><circle cx="9.5" cy="2.5" r="1" fill="#7cc27a"/></pattern>`;
      return `url(#${id}f)`;
    }
    return c;
  };
  const P = (d, c, extra = '') => `<path d="${d}" fill="${fill(c)}" stroke="${EDGE}" stroke-width=".8" ${extra}/>`;
  const out = [];
  const shoes = (kind, c) => {
    if (kind === 'sneaker') return [49, 71].map(x => `<ellipse cx="${x}" cy="154" rx="10" ry="4.5" fill="#fff" stroke="#9aa0a6"/><path d="M${x - 9} 155 h18" stroke="#9aa0a6"/>`).join('');
    if (kind === 'mule') return [51, 69].map(x => `<ellipse cx="${x}" cy="153" rx="6.5" ry="3" fill="${SKIN}" stroke="${EDGE}"/><path d="M${x - 6} 151 h9 v4 h-9z" fill="#c9a66b"/>`).join('');
    if (kind === 'pumps') return [51, 69].map(x => `<path d="M${x - 7} 154 Q${x - 7} 149 ${x - 2} 149 L${x + 5} 149 L${x + 6} 154Z" fill="${c}"/><rect x="${x + 4}" y="153" width="2" height="4" fill="${c}"/>`).join('');
    return [49, 71].map(x => `<ellipse cx="${x}" cy="154" rx="10" ry="4" fill="#1a1a1a"/>`).join('');
  };
  const arc = (y1, n, r, c) => { // ネックレス（2次ベジェ上に珠を並べる）
    let s2 = '';
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = (1 - t) ** 2 * 52 + 2 * t * (1 - t) * 60 + t * t * 68, y = (1 - t) ** 2 * 44 + 2 * t * (1 - t) * y1 + t * t * 44;
      s2 += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${c}" stroke="rgba(0,0,0,.25)" stroke-width=".4"/>`;
    }
    return s2;
  };

  if (s.g === 'm') {
    if (s.top === 'hoodie') out.push(P('M42 48 Q38 16 60 12 Q82 16 78 48Z', s.c));
    out.push(P('M39 100 L59 100 L57 151 L43 151Z', s.legs || s.c), P('M61 100 L81 100 L77 151 L63 151Z', s.legs || s.c));
    out.push(shoes(s.shoes, ''));
    out.push(P('M38 50 Q40 44 51 43 L69 43 Q80 44 82 50 L84 101 L36 101Z', s.c));
    if (s.top === 'polo') {
      out.push(P('M38 50 L33 66 L42 68 L44 58Z', s.c), P('M82 50 L87 66 L78 68 L76 58Z', s.c));
      out.push(P('M34 66 L30 97 L37 99 L42 68Z', SKIN), P('M86 66 L90 97 L83 99 L78 68Z', SKIN));
    } else {
      out.push(P('M38 50 L30 97 L37 99 L44 62Z', s.c), P('M82 50 L90 97 L83 99 L76 62Z', s.c));
    }
    out.push(`<circle cx="33" cy="100" r="4.5" fill="${SKIN}"/><circle cx="87" cy="100" r="4.5" fill="${SKIN}"/>`);
    out.push(`<rect x="55" y="35" width="10" height="9" fill="${SKIN}"/>`);
    if (s.top === 'suit' || s.top === 'jacket') {
      out.push(P('M52 43 L60 64 L68 43Z', s.inner || '#fff'));
      if (s.tie) out.push(`<path d="M58 45 L62 45 L63.5 70 L60 75 L56.5 70Z" fill="${s.tie}"/>`);
      out.push(`<path d="M52 43 L57 72 M68 43 L63 72" stroke="rgba(0,0,0,.3)" fill="none"/><circle cx="60" cy="84" r="1.4" fill="rgba(0,0,0,.35)"/>`);
      if (s.emblem) out.push(`<circle cx="72" cy="60" r="3" fill="#d4a72c"/>`);
    } else if (s.top === 'polo') {
      out.push(P('M52 43 L60 50 L68 43 L65 40 L60 46 L55 40Z', s.c), `<path d="M60 50 V60" stroke="rgba(0,0,0,.3)"/><circle cx="60" cy="54" r=".9" fill="#fff"/><circle cx="60" cy="58" r=".9" fill="#fff"/>`);
    } else if (s.top === 'hoodie') {
      out.push(`<path d="M56 46 L55 62 M64 46 L65 62" stroke="#fff" stroke-width="1.2"/>`, P('M48 80 L72 80 L74 96 L46 96Z', s.c));
    }
    out.push(`<circle cx="60" cy="25" r="${s.young ? 12.5 : 13}" fill="${SKIN}"/>`);
    out.push(`<path d="M47 24 Q46 9 60 9 Q74 9 73 24 Q70 15 60 15 Q50 15 47 24Z" fill="${HAIR}"/>`);
  } else {
    out.push(`<path d="M44 30 Q42 7 60 7 Q78 7 76 30 L78 52 L42 52Z" fill="${HAIR}"/>`);
    if (s.top === 'jacket') {
      if (s.bottom === 'pants') {
        out.push(P('M43 92 L59 92 L58 150 L46 150Z', s.c), P('M61 92 L77 92 L74 150 L62 150Z', s.c));
      } else {
        out.push(`<rect x="48" y="122" width="7" height="28" fill="${SKIN}"/><rect x="65" y="122" width="7" height="28" fill="${SKIN}"/>`);
        out.push(P('M42 90 L78 90 L82 124 L38 124Z', s.c));
      }
      out.push(shoes('pumps', s.shoeC || '#2a2a2a'));
      out.push(P('M44 47 Q50 43 60 43 Q70 43 76 47 L78 93 L42 93Z', s.c));
      out.push(P('M44 47 L37 95 L43 97 L48 60Z', s.c), P('M76 47 L83 95 L77 97 L72 60Z', s.c));
      out.push(`<rect x="56" y="35" width="8" height="9" fill="${SKIN}"/>`);
      out.push(P('M53 43 L60 60 L67 43Z', s.inner));
      out.push(`<path d="M53 43 L57 74 M67 43 L63 74" stroke="rgba(0,0,0,.3)" fill="none"/>`);
    } else {
      out.push(`<rect x="48" y="126" width="7" height="24" fill="${SKIN}"/><rect x="65" y="126" width="7" height="24" fill="${SKIN}"/>`);
      out.push(shoes(s.shoes || 'pumps', s.shoeC || '#2a2a2a'));
      out.push(`<rect x="56" y="35" width="8" height="10" fill="${SKIN}"/>`);
      if (s.off) {
        out.push(P('M42 51 Q46 44 60 44 Q74 44 78 51 L76 60 L44 60Z', SKIN));
        out.push(P('M43 51 L35 95 L41 97 L47 60Z', SKIN), P('M77 51 L85 95 L79 97 L73 60Z', SKIN));
        out.push(P('M45 57 L75 57 L73 80 L84 128 L36 128 L47 80Z', s.dress));
      } else {
        out.push(P('M40 62 L35 95 L41 97 L46 64Z', SKIN), P('M80 62 L85 95 L79 97 L74 64Z', SKIN));
        out.push(P('M45 46 Q52 43 60 43 Q68 43 75 46 L73 80 L84 128 L36 128 L47 80Z', s.dress));
        out.push(P('M45 46 L39 62 L46 64 L48 54Z', s.dress), P('M75 46 L81 62 L74 64 L72 54Z', s.dress));
        out.push(`<path d="M54 43 Q60 49 66 43" fill="${SKIN}"/>`);
      }
    }
    out.push(`<circle cx="38" cy="98" r="4" fill="${SKIN}"/><circle cx="82" cy="98" r="4" fill="${SKIN}"/>`);
    if (s.bag) out.push(`<path d="M82 98 Q88 90 94 98" stroke="${s.bag}" stroke-width="1.5" fill="none"/><rect x="80" y="98" width="16" height="11" rx="2" fill="${s.bag}" stroke="${EDGE}"/>`);
    out.push(`<circle cx="60" cy="25" r="12.5" fill="${SKIN}"/>`);
    out.push(`<path d="M47 25 Q47 11 60 11 Q73 11 73 25 Q67 16 60 17 Q53 16 47 25Z" fill="${HAIR}"/>`);
    if (s.necklace >= 1) out.push(arc(52, 8, 1.5, '#fbf8f0'));
    if (s.necklace >= 2) out.push(arc(58, 10, 1.5, '#fbf8f0'));
    if (s.gold) out.push(`<path d="M52 44 Q60 56 68 44" stroke="#d4a72c" stroke-width="1.6" fill="none"/><circle cx="60" cy="52" r="3" fill="#e8b923" stroke="#a87d12" stroke-width=".6"/><path d="M66 52 l4 0 M68 50 l0 4 M51 50 l3 0 M52.5 48.5 l0 3" stroke="#e8b923" stroke-width="1"/>`);
  }
  // 顔
  out.push(`<circle cx="55.5" cy="26" r="1.1" fill="#3a302a"/><circle cx="64.5" cy="26" r="1.1" fill="#3a302a"/><path d="M57 31 Q60 33 63 31" stroke="#a0644a" stroke-width="1" fill="none"/>`);
  return `<svg viewBox="0 0 120 162" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="服装のイラスト"><defs>${Object.values(defs).join('')}</defs>${out.join('')}</svg>`;
}

const TYPE_LABEL ={ joy: 'お祝いの席', sad: '弔事', biz: 'ビジネス' };
const ROUND = 10;
const BEST_KEY = 'heihuku-best';

const $ = id => document.getElementById(id);
let order = [], idx = 0, score = 0, log = [];

function getBest() { try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem(BEST_KEY, v); } catch (e) {} }
function showBest() { const b = getBest(); $('best').textContent = b ? `これまでの最高：${b} / ${ROUND}問` : ''; }

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function show(id) {
  ['start', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo(0, 0);
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function start() {
  order = shuffle(QUESTIONS).slice(0, ROUND);
  idx = 0; score = 0; log = [];
  show('quiz'); renderQ();
}

function renderQ() {
  const q = order[idx];
  $('qNum').textContent = `第${idx + 1}問 / ${order.length}`;
  $('qScore').textContent = `正解 ${score}`;
  $('qBar').style.width = `${idx / order.length * 100}%`;
  $('qFig').innerHTML = figure(q.fig);
  $('qStamp').className = 'stamp';
  $('qTag').className = `tag ${q.type}`;
  $('qTag').textContent = TYPE_LABEL[q.type];
  $('qScene').textContent = `「平服で」と言われた ${q.scene}`;
  $('qOutfit').textContent = q.outfit;
  document.querySelectorAll('.answers button').forEach(b => { b.disabled = false; b.classList.remove('picked'); });
  $('feedback').classList.add('hidden');
  $('nextBtn').classList.add('hidden');
}

function answer(btn) {
  const q = order[idx];
  const pick = btn.dataset.ans === '1';
  const right = pick === q.ok;
  if (right) score++;
  log.push({ q, right });
  document.querySelectorAll('.answers button').forEach(b => b.disabled = true);
  btn.classList.add('picked');
  $('feedback').className = `feedback ${right ? 'right' : 'wrong'}`;
  $('fbVerdict').textContent = `${right ? '正解！' : '不正解…'}　答えは「${q.ok ? '○' : '✕'}」`;
  $('fbText').textContent = q.exp;
  $('qStamp').textContent = q.ok ? '○' : '✕';
  $('qStamp').className = `stamp ${q.ok ? 'o' : 'x'} show`;
  $('qScore').textContent = `正解 ${score}`;
  $('nextBtn').textContent = idx + 1 < order.length ? '次へ' : '結果を見る';
  $('nextBtn').classList.remove('hidden');
  $('nextBtn').focus({ preventScroll: true });
  $('nextBtn').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function rank(s, n) {
  const r = s / n;
  if (r === 1) return ['平服マスター', 'どんな招待状が来ても安心。周りの人にも教えてあげてください。'];
  if (r >= .8) return ['マナー上級者', 'ほぼ完璧！ 間違えた問題だけ答え合わせで確認しておきましょう。'];
  if (r >= .5) return ['まずまず', '基本は押さえています。「平服＝略礼装」を意識すると迷いが減ります。'];
  return ['要注意', '「平服＝普段着」ではありません。答え合わせでポイントを確認しましょう。'];
}

function finish() {
  const [title, comment] = rank(score, order.length);
  $('rScore').textContent = `${score} / ${order.length}`;
  $('rRank').textContent = title;
  $('rComment').textContent = comment;
  if (score > getBest()) setBest(score);
  $('review').innerHTML = '';
  log.forEach(({ q, right }) => {
    const li = document.createElement('li');
    li.innerHTML = `<div class="thumb">${figure(q.fig)}</div><div class="body"><div><span class="mark ${right ? 'r' : 'w'}"></span><span class="t"></span></div><div class="exp"></div></div>`;
    li.querySelector('.mark').textContent = right ? '○' : '✕';
    li.querySelector('.t').textContent = `${q.scene}：${q.outfit} → 答え「${q.ok ? '○' : '✕'}」`;
    li.querySelector('.exp').textContent = q.exp;
    $('review').appendChild(li);
  });
  show('result');
}

async function share() {
  const text = `平服判別クイズで ${score}/${order.length}問正解！【${rank(score, order.length)[0]}】`;
  const url = location.href.split('#')[0].split('?')[0];
  if (navigator.share) {
    try { await navigator.share({ title: '平服判別クイズ', text, url }); } catch (e) {}
    return;
  }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('コピーしました'); }
  catch (e) { prompt('コピーしてください', `${text}\n${url}`); }
}

document.querySelectorAll('.answers button').forEach(b => b.addEventListener('click', () => answer(b)));
$('nextBtn').addEventListener('click', () => { idx++; idx < order.length ? renderQ() : finish(); });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('shareBtn').addEventListener('click', share);
$('qCount').textContent = ROUND;
$('hero').innerHTML = figure({ g: 'm', top: 'suit', c: NAVY, tie: '#d9963a' }) + figure({ g: 'f', dress: NAVY, necklace: 1, bag: '#c9a66b' });
showBest();
</script>
